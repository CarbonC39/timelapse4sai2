name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-features --locked
      - name: Build
        run: cargo build --release --all-features --locked
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for edition in gui cli; do
            name="timelapse4sai2-$TAG-linux-x64-$edition"
            binary="timelapse4sai2"
            if [ "$edition" = gui ]; then binary="timelapse4sai2-gui"; fi
            mkdir -p "dist/$name"
            install -m 755 "target/release/$binary" "dist/$name/"
            cp README.md LICENSE shell.nix "dist/$name/"
            tar -C dist -czf "$name.tar.gz" "$name"
          done
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($edition in @("gui", "cli")) {
            $name = "timelapse4sai2-$env:TAG-windows-x64-$edition"
            $binary = if ($edition -eq "gui") { "timelapse4sai2-gui.exe" } else { "timelapse4sai2.exe" }
            New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
            Copy-Item "target/release/$binary" "dist/$name/"
            Copy-Item README.md, LICENSE "dist/$name/"
            Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip" -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: timelapse4sai2-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
