name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            container: ubuntu:22.04
            artifact: linux
          - os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Bootstrap Linux container
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: bash scripts/linux-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-features --locked
      - name: Build
        run: cargo build --release --all-features --locked
      - name: Package and smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/package-linux.sh "$TAG"
          bash scripts/smoke-linux.sh
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($edition in @("gui", "cli")) {
            $name = "timelapse4sai2-$env:TAG-windows-x64-$edition"
            $binary = if ($edition -eq "gui") { "timelapse4sai2-gui.exe" } else { "timelapse4sai2.exe" }
            New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
            Copy-Item "target/release/$binary" "dist/$name/"
            Copy-Item README.md, LICENSE "dist/$name/"
            Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip" -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: timelapse4sai2-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
